<article class="widget-card">
  <header class="widget-card__header">
    <h3>Humedad</h3>
    <span>%</span>
  </header>

  <div class="humidity-widget">
    <svg viewBox="0 0 160 98" class="humidity-widget__gauge" aria-hidden="true">
      <path d="M18 82 A62 62 0 0 1 142 82" class="humidity-widget__track"></path>
      <path
        d="M18 82 A62 62 0 0 1 142 82"
        class="humidity-widget__progress"
        [attr.stroke-dasharray]="circumference"
        [attr.stroke-dashoffset]="dashOffset">
      </path>
    </svg>

    <div class="humidity-widget__center">
      <p class="humidity-widget__value">{{ clampedHumidity | number: '1.0-0' }}%</p>
      <p class="humidity-widget__status">Nivel estable</p>
    </div>

    <div class="humidity-widget__range" aria-hidden="true">
      <span>35%</span>
      <span>85%</span>
    </div>
  </div>
</article>
